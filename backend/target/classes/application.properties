# Secrets and credentials come from the environment (never commit them).
# For local dev copy .env.example to .env (git-ignored) in the repo root or backend/.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Server
server.port=8081

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskhub_dev}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Required, no default: the app refuses to start without it.
# Generate with: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000

# CORS
app.cors.allowed-origins=http://localhost:3000

# Rate Limiting (requests per minute per IP)
rate-limit.auth.capacity=10
rate-limit.auth.refill-per-minute=10
rate-limit.refresh.capacity=30
rate-limit.refresh.refill-per-minute=30
rate-limit.api.capacity=100
rate-limit.api.refill-per-minute=100
